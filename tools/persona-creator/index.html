<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona Creator - POC Tools</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>

  <header>
    <h1><i class="fa-solid fa-user"></i> Persona Creator</h1>
    <p class="subtitle">Generate quick, realistic personas from basic attributes.</p>
  </header>

  <section class="form-section">
    <label>Role / Job Title:</label>
    <input type="text" id="role" placeholder="e.g. Marketing Manager">

    <label>Goal / Objective:</label>
    <input type="text" id="goal" placeholder="e.g. Increase brand awareness">

    <label>Challenge / Pain Point:</label>
    <input type="text" id="challenge" placeholder="e.g. Limited ad budget">

    <label>Tone / Personality:</label>
    <select id="tone">
      <option value="professional">Professional</option>
      <option value="creative">Creative</option>
      <option value="friendly">Friendly</option>
      <option value="analytical">Analytical</option>
    </select>

    <button onclick="generatePersona()" class="btn-primary">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Persona
    </button>
  </section>

  <section id="personaCard" class="persona-card hidden">
    <img id="avatar" alt="Avatar" />
    <h2 id="personaName"></h2>
    <p><strong>Role:</strong> <span id="personaRole"></span></p>
    <p><strong>Personality:</strong> <span id="personaPersonality"></span></p>
    <p><strong>Goal:</strong> <span id="personaGoal"></span></p>
    <p><strong>Challenge:</strong> <span id="personaChallenge"></span></p>
    <p id="personaSummary" class="summary"></p>

    <div class="action-buttons">
      <button class="btn-primary" onclick="generatePersona()">Generate Another</button>
      <button class="btn-secondary" onclick="copyPersona()">Copy Persona</button>
    </div>
  </section>

  <footer style="margin-top: 40px; text-align: center; color: #777; font-size: 14px;">
    <p>POC Tools by <strong>amrshah</strong> · <i class="fa-solid fa-flask"></i> Proof of Concept Collection</p>
  </footer>
</body>
</html>
