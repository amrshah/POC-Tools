<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Chat Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f9fafb;
      color: #111;
    }

    body.dark {
      background: #0a0a0a;
      color: #f9fafb;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #ddd;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    body.dark header {
      background: rgba(0, 0, 0, 0.7);
      border-color: #333;
    }

    main {
      max-width: 800px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .bubble {
      border-radius: 16px;
      padding: 12px 16px;
      margin: 10px 0;
      line-height: 1.5;
    }

    .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: .6;
      margin-bottom: 4px;
    }

    .user {
      background: #e0f2fe;
      align-self: flex-end;
    }

    .assistant {
      background: #f4f4f5;
    }

    .system {
      background: #fef3c7;
    }

    body.dark .user {
      background: #0b3a5b;
    }

    body.dark .assistant {
      background: #18181b;
    }

    body.dark .system {
      background: #3a2d09;
    }

    .drop {
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
      color: #777;
    }

    pre {
      white-space: pre-wrap;
      background: #eee;
      padding: .5rem;
      border-radius: .5rem;
    }

    body.dark pre {
      background: #222;
    }
  </style>
</head>

<body>
  <header>
    <strong>Markdown Chat Viewer</strong>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" />
    <button id="themeToggle">Toggle Theme</button>
  </header>
  <main>
    <div class="drop" id="dropZone">Drop a markdown chat file here or use the file input above.</div>
    <div id="chat"></div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const toggleBtn = document.getElementById("themeToggle");

    function parseChat(md) {
      const tagRegex = /\\n?\\s{0,3}(?:#{1,6}\\s*)?(?:\\*\\*|__)?\\s*(User|Assistant|System)\\s*(?:\\*\\*|__)?\\s*:?[ \\t]*\\n/gi;
      const roles = [], indices = [];
      let m;
      while ((m = tagRegex.exec(md)) !== null) {
        roles.push(m[1].toLowerCase());
        indices.push(m.index + m[0].length);
      }
      if (!roles.length) return [{ role: "assistant", content: md.trim() }];
      const messages = [];
      for (let i = 0; i < indices.length; i++) {
        const start = indices[i];
        const end = i + 1 < indices.length ? indices[i + 1] : md.length;
        const content = md.slice(start, end).trim();
        if (content) messages.push({ role: roles[i], content });
      }
      return messages;
    }

    function renderChat(messages) {
      chat.innerHTML = "";
      for (const msg of messages) {
        const div = document.createElement("div");
        div.className = `bubble ${msg.role}`;
        const roleDiv = document.createElement("div");
        roleDiv.className = "role";
        roleDiv.textContent = msg.role;
        const html = DOMPurify.sanitize(marked.parse(msg.content, { mangle: false, headerIds: false }));
        const content = document.createElement("div");
        content.innerHTML = html;
        div.append(roleDiv, content);
        chat.append(div);
      }
    }

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const md = reader.result;
        renderChat(parseChat(md));
      };
      reader.readAsText(file);
    }

    fileInput.addEventListener("change", e => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    dropZone.addEventListener("dragover", e => { e.preventDefault(); });
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    toggleBtn.addEventListener("click", () => document.body.classList.toggle("dark"));
  </script>
</body>

</html>
