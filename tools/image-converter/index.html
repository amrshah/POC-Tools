<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useful Tools Directory</title>
  <!-- Font Awesome CDN -->
<link  rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow mb-8">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold"><i class="fa-solid fa-globe text-black-600"></i> Web Goodies</h1>
      <a href="https://github.com/amrshah/POC-Tools" target="_blank"
         class="text-blue-600 hover:underline">GitHub Repo</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6">
<section class="bg-white p-6 rounded-lg shadow mt-10">
  <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-shuffle"></i> Image Converter</h2>
  <p class="text-gray-600 mb-4">
    Convert and preview images side by side — supports JPG, PNG, WebP, and SVG inputs. All runs locally in your browser.
  </p>

  <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-6">
    <input type="file" id="convertInput" accept="image/*,.svg" multiple class="border p-2 rounded w-full sm:w-auto">
    <select id="formatSelect" class="border p-2 rounded">
      <option value="png">PNG</option>
      <option value="jpeg">JPG</option>
      <option value="webp">WebP</option>
    </select>
    <button id="convertBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Convert
    </button>
  </div>

  <div id="convertOutput" class="space-y-6"></div>

  <div class="mt-6 text-center">
    <button id="downloadZipBtn" class="hidden bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Download All as ZIP
    </button>
  </div>
</section>





  </main>

  <footer class="mt-10 py-6 text-center text-sm text-gray-500">
    © 2025 Amr Shah — Web Goodies
  </footer>
<!-- JS Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
const convertInput = document.getElementById('convertInput');
const formatSelect = document.getElementById('formatSelect');
const convertBtn = document.getElementById('convertBtn');
const convertOutput = document.getElementById('convertOutput');
const downloadZipBtn = document.getElementById('downloadZipBtn');

let convertedImages = [];

// Load image safely, converting SVG into base64 DataURL
async function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;

    if (file.type === 'image/svg+xml') {
      const reader = new FileReader();
      reader.onload = () => {
        // Create base64 dataURL for SVG
        const svgBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(reader.result)));
        img.src = svgBase64;
      };
      reader.readAsText(file);
    } else {
      img.src = URL.createObjectURL(file);
    }
  });
}

convertBtn.addEventListener('click', async () => {
  const files = Array.from(convertInput.files);
  const targetFormat = formatSelect.value;
  if (files.length === 0) return alert('Please select one or more images.');

  convertOutput.innerHTML = '';
  convertedImages = [];

  for (const file of files) {
    try {
      const img = await loadImage(file);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const mimeType = `image/${targetFormat}`;
      const dataURL = canvas.toDataURL(mimeType);

      convertedImages.push({ name: file.name, dataURL, format: targetFormat });

      // Create reliable preview
      const originalURL =
        file.type === 'image/svg+xml'
          ? 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(await file.text())))
          : URL.createObjectURL(file);

      const preview = document.createElement('div');
      preview.className = "grid grid-cols-1 md:grid-cols-2 gap-4 p-4 border rounded-lg bg-gray-50";

      preview.innerHTML = `
        <div class="text-center">
          <h3 class="font-semibold mb-2 text-sm text-gray-600">Original (${file.name.split('.').pop().toUpperCase()})</h3>
          <img src="${originalURL}" class="mx-auto rounded shadow max-h-64 object-contain">
        </div>
        <div class="text-center">
          <h3 class="font-semibold mb-2 text-sm text-gray-600">Converted (${targetFormat.toUpperCase()})</h3>
          <img src="${dataURL}" class="mx-auto rounded shadow max-h-64 object-contain mb-2">
          <a href="${dataURL}" download="${file.name.replace(/\.[^/.]+$/, '')}.${targetFormat}"
             class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 text-sm">Download</a>
        </div>
      `;
      convertOutput.appendChild(preview);
    } catch (err) {
      console.error('Failed to convert image:', file.name, err);
      const errorDiv = document.createElement('div');
      errorDiv.className = "text-red-600 text-sm";
      errorDiv.textContent = `⚠️ Failed to process ${file.name}`;
      convertOutput.appendChild(errorDiv);
    }
  }

  if (convertedImages.length > 1) downloadZipBtn.classList.remove('hidden');
});

downloadZipBtn.addEventListener('click', async () => {
  const zip = new JSZip();
  for (const img of convertedImages) {
    const base64 = img.dataURL.split(',')[1];
    const name = img.name.replace(/\.[^/.]+$/, '') + '.' + img.format;
    zip.file(name, base64, { base64: true });
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  saveAs(blob, 'converted_images.zip');
});
</script>


</body>
</html>
