<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useful Tools Directory</title>
  <!-- Font Awesome CDN -->
<link  rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow mb-8">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold"><i class="fa-solid fa-globe text-black-600"></i> Web Goodies</h1>
      <a href="https://github.com/amrshah/POC-Tools" target="_blank"
         class="text-blue-600 hover:underline">GitHub Repo</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6">
<section class="bg-white p-6 rounded-lg shadow mt-10">
  <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-shuffle"></i> Image Converter</h2>
  <p class="text-gray-600 mb-4">Convert between formats — e.g. SVG, JPG, PNG, WebP. All processing happens in your browser.</p>

  <div class="flex flex-col sm:flex-row sm:items-center gap-4 mb-6">
    <input type="file" id="convertInput" accept="image/*" class="border p-2 rounded w-full sm:w-auto">
    <select id="formatSelect" class="border p-2 rounded">
      <option value="png">PNG</option>
      <option value="jpeg">JPG</option>
      <option value="webp">WebP</option>
    </select>
    <button id="convertBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Convert
    </button>
  </div>

  <div id="convertOutput" class="mt-6"></div>
</section>



  </main>

  <footer class="mt-10 py-6 text-center text-sm text-gray-500">
    © 2025 Amr Shah — Web Goodies
  </footer>
<script>
const convertInput = document.getElementById('convertInput');
const formatSelect = document.getElementById('formatSelect');
const convertBtn = document.getElementById('convertBtn');
const convertOutput = document.getElementById('convertOutput');

convertBtn.addEventListener('click', async () => {
  const file = convertInput.files[0];
  if (!file) return alert('Please select an image first.');

  const targetFormat = formatSelect.value;

  // Load the image
  const img = new Image();
  img.src = URL.createObjectURL(file);
  await img.decode();

  // Draw it on a canvas
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  // Convert to desired format
  let mimeType = `image/${targetFormat}`;
  const dataURL = canvas.toDataURL(mimeType);

  // Generate download link
  convertOutput.innerHTML = `
    <div class="text-center">
      <img src="${dataURL}" class="mx-auto rounded shadow mb-4 max-h-64 object-contain">
      <a href="${dataURL}" download="converted.${targetFormat}" 
         class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Download ${targetFormat.toUpperCase()}</a>
    </div>
  `;
});
</script>

</body>
</html>
