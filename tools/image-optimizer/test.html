<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compressor & Resizer - POC Tools</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      line-height: 1.6;
    }

    header { margin-bottom: 30px; }
    h1 { font-size: 28px; color: #333; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; }

    .format-buttons {
            display: flex;
            gap: 10px;
        }

        .format-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .format-btn:hover {
            background: #f5f5f5;
        }

        .format-btn.active {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
        }

    .upload-zone {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 4px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .upload-zone:hover { border-color: #999; background: #fafafa; }
    .upload-zone.dragover { border-color: #0066cc; background: #f0f7ff; }

    .upload-zone i {
      font-size: 48px;
      color: #999;
      margin-bottom: 15px;
    }

    input[type="file"] { display: none; }

    .settings {
      background: white;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .settings.show { display: block; }

    .setting-row { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }

    input[type="range"] { width: 100%; margin: 10px 0; }
    .quality-display { text-align: right; color: #666; font-size: 14px; }

    .resize-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .resize-inputs input[type="number"] {
      width: 100px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .resize-percentage-display {
      text-align: right;
      color: #666;
      font-size: 14px;
    }

    .preview-container { display: none; margin-bottom: 20px; }
    .preview-container.show { display: block; }

    .images-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .image-box {
      background: white;
      padding: 15px;
      border-radius: 4px;
    }

    .image-box img {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .btn-primary { background: #0066cc; color: white; flex: 1; }
    .btn-primary:hover { background: #0052a3; }
    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #e5e5e5; }

    @media (max-width: 768px) {
      .images-grid { grid-template-columns: 1fr; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>

  <header>
    <h1>Image Compressor & Resizer</h1>
    <p class="subtitle">Resize or compress images with live preview and scaling</p>
  </header>

  
</body>
</html>
